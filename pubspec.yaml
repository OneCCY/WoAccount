name: wo_account
description: "WoAccount - AI智能记账App，本地优先，Flutter + Drift + Riverpod"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # === 状态管理 ===
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # === 路由 ===
  go_router: ^14.8.1

  # === 本地数据库 ===
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # === 网络请求 (调用 LLM API) ===
  dio: ^5.8.0+1

  # === JSON 序列化 ===
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1

  # === UI 组件 ===
  fl_chart: ^0.70.2
  flutter_slidable: ^3.1.1
  image_picker: ^1.1.2

  # === 媒体 ===
  record: ^7.0.0
  audioplayers: ^6.7.1

  # === 国际化 ===
  intl: ^0.20.2

  # === 工具 ===
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  share_plus: ^10.1.4
  collection: ^1.19.1

  # === 安全 ===
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # === 代码生成 ===
  drift_dev: ^2.24.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.3
  json_serializable: ^6.9.5
  freezed: ^2.5.8

  # === 测试 ===
  mockito: ^5.4.5

flutter:
  generate: true
  uses-material-design: true
