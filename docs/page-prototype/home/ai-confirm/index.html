<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WoAccount - AI解析确认</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <style>
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: flex-end;
    }
    .confirm-card {
      background: #fff;
      width: 100%;
      border-radius: 20px 20px 0 0;
      padding: 24px;
      animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .confirm-card .handle {
      width: 40px;
      height: 4px;
      background: #e0e0e0;
      border-radius: 2px;
      margin: 0 auto 20px;
    }
    .confirm-card .title {
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      color: #212121;
      margin-bottom: 4px;
    }
    .confirm-card .subtitle {
      text-align: center;
      font-size: 13px;
      color: #9e9e9e;
      margin-bottom: 20px;
    }
    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .result-item {
      background: #f5f5f5;
      border-radius: 10px;
      padding: 12px;
    }
    .result-item .label {
      font-size: 12px;
      color: #9e9e9e;
      margin-bottom: 4px;
    }
    .result-item .value {
      font-size: 15px;
      font-weight: 600;
      color: #212121;
    }
    .result-item.full {
      grid-column: 1 / -1;
    }
    .confidence {
      margin-bottom: 20px;
    }
    .confidence .label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #757575;
      margin-bottom: 6px;
    }
    .confidence .bar {
      height: 8px;
      background: #f5f5f5;
      border-radius: 4px;
      overflow: hidden;
    }
    .confidence .bar .fill {
      width: 92%;
      height: 100%;
      background: #4caf50;
      border-radius: 4px;
    }
    .edit-tags {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .edit-tag {
      flex: 1;
      text-align: center;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      font-size: 13px;
      color: #757575;
      cursor: pointer;
    }
    .edit-tag:hover {
      border-color: #4caf50;
      color: #4caf50;
    }
    .btn-row {
      display: flex;
      gap: 12px;
    }
    .btn-row .btn {
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="status-bar">
      <span>9:41</span>
      <span>WoAccount</span>
      <span></span>
    </div>

    <div class="content" style="background:#fff;">
      <!-- 背景内容（模糊） -->
      <div style="padding:16px; opacity:0.3;">
        <div style="background:#f5f5f5; border-radius:12px; padding:12px 16px; margin-bottom:12px;">
          📝 输入消费描述...
        </div>
        <div style="height:200px;"></div>
      </div>

      <!-- 弹出卡片 -->
      <div class="overlay">
        <div class="confirm-card">
          <div class="handle"></div>
          <div class="title">🤖 AI解析结果</div>
          <div class="subtitle">原始输入: 午饭吃了碗拉面25元</div>

          <div class="result-grid">
            <div class="result-item">
              <div class="label">💰 金额</div>
              <div class="value">¥25.00</div>
            </div>
            <div class="result-item">
              <div class="label">📅 日期</div>
              <div class="value">2025-01-15</div>
            </div>
            <div class="result-item">
              <div class="label">🍜 分类</div>
              <div class="value">餐饮 > 午餐</div>
            </div>
            <div class="result-item">
              <div class="label">⏱️ 解析耗时</div>
              <div class="value">850ms</div>
            </div>
            <div class="result-item full">
              <div class="label">📝 描述</div>
              <div class="value">午饭拉面</div>
            </div>
          </div>

          <div class="confidence">
            <div class="label">
              <span>置信度</span>
              <span>92%</span>
            </div>
            <div class="bar">
              <div class="fill"></div>
            </div>
          </div>

          <div class="edit-tags">
            <span class="edit-tag">修改分类</span>
            <span class="edit-tag">修改金额</span>
            <span class="edit-tag">修改日期</span>
          </div>

          <div class="btn-row">
            <button class="btn btn-outline">取消</button>
            <button class="btn btn-primary">确认记账</button>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom-nav">
      <a href="../../transaction-list/index.html" class="nav-item">
        <span class="nav-icon">📋</span>
        <span>账单</span>
      </a>
      <a href="../index.html" class="nav-item active">
        <span class="nav-icon">✏️</span>
        <span>记账</span>
      </a>
      <a href="../../profile/index.html" class="nav-item">
        <span class="nav-icon">👤</span>
        <span>我的</span>
      </a>
    </div>
  </div>
</body>
</html>
