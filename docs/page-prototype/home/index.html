<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WoAccount - 记账首页</title>
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    .phone-frame {
      position: relative;
    }
    .content {
      padding-bottom: 0;
    }
    /* 记账输入栏 - 固定底部 */
    .input-section {
      background: #fff;
      padding: 12px 16px;
      border-top: 1px solid #f0f0f0;
      flex-shrink: 0;
    }
    .input-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .input-bar .side-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid #e0e0e0;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .input-bar .side-btn:hover {
      background: #f5f5f5;
    }
    .input-bar .side-btn:active {
      background: #e8f5e9;
    }
    .input-bar .text-input {
      flex: 1;
      height: 44px;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 15px;
      outline: none;
      color: #212121;
      transition: border-color 0.2s;
    }
    .input-bar .text-input:focus {
      border-color: #4caf50;
    }
    .input-bar .text-input::placeholder {
      color: #bdbdbd;
    }
    .submit-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }
    .submit-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 28px;
      border-radius: 10px;
      border: none;
      background: #4caf50;
      color: #fff;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .submit-btn:hover {
      opacity: 0.9;
    }
    .voice-hint {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #bdbdbd;
    }
    .voice-hint .icon {
      font-size: 12px;
    }
    .today-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
    }
    .today-header .label {
      font-size: 14px;
      color: #757575;
    }
    .today-header .total {
      font-size: 18px;
      font-weight: 700;
      color: #f44336;
    }
    .insight-card {
      background: #fff3e0;
      margin: 12px 16px;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .insight-card .icon {
      font-size: 24px;
    }
    .insight-card .text {
      flex: 1;
      font-size: 13px;
      color: #e65100;
    }
    .insight-card .action {
      font-size: 13px;
      color: #ff9800;
      font-weight: 500;
      cursor: pointer;
    }
    .ai-entry {
      margin: 12px 16px;
      background: linear-gradient(135deg, #e8f5e9 0%, #f1f8e9 100%);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s;
    }
    .ai-entry:hover {
      transform: scale(0.98);
    }
    .ai-entry .icon {
      font-size: 32px;
    }
    .ai-entry .info {
      flex: 1;
    }
    .ai-entry .info .title {
      font-size: 15px;
      font-weight: 600;
      color: #2e7d32;
    }
    .ai-entry .info .desc {
      font-size: 12px;
      color: #66bb6a;
      margin-top: 2px;
    }
    .ai-entry .arrow {
      font-size: 18px;
      color: #66bb6a;
    }
    /* 长按语音浮层 */
    .voice-overlay {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      background: rgba(0,0,0,0.75);
      border-radius: 20px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 100;
    }
    .voice-overlay.show {
      display: flex;
    }
    .voice-overlay .mic-icon {
      font-size: 48px;
      animation: pulse 1s ease-in-out infinite;
    }
    .voice-overlay .text {
      color: #fff;
      font-size: 14px;
    }
    .voice-overlay .hint {
      color: rgba(255,255,255,0.6);
      font-size: 11px;
      text-align: center;
      line-height: 1.5;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
    .nav-item.voice-active .nav-icon {
      animation: pulse 0.8s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <!-- 状态栏 -->
    <div class="status-bar">
      <span>9:41</span>
      <span>WoAccount</span>
      <span>⚙️</span>
    </div>

    <!-- 可滚动内容区 -->
    <div class="content">
      <!-- 今日消费 -->
      <div class="today-header">
        <span class="label">📅 今日消费</span>
        <span class="total">¥71.00</span>
      </div>

      <div class="list-item">
        <div class="icon" style="background:#fff3e0;">🍜</div>
        <div class="info">
          <div class="title">午饭拉面</div>
          <div class="subtitle">12:30 · 餐饮 > 午餐</div>
        </div>
        <div class="amount expense">-¥25.00</div>
      </div>

      <div class="list-item">
        <div class="icon" style="background:#e3f2fd;">🚗</div>
        <div class="info">
          <div class="title">打车去公司</div>
          <div class="subtitle">09:15 · 交通 > 打车</div>
        </div>
        <div class="amount expense">-¥28.00</div>
      </div>

      <div class="list-item">
        <div class="icon" style="background:#fff3e0;">☕</div>
        <div class="info">
          <div class="title">下午茶咖啡</div>
          <div class="subtitle">15:45 · 餐饮 > 饮料</div>
        </div>
        <div class="amount expense">-¥18.00</div>
      </div>

      <!-- 今日洞察 -->
      <div class="insight-card">
        <span class="icon">💡</span>
        <span class="text">今日消费已超过日均预算的80%</span>
        <span class="action">查看详情</span>
      </div>

      <!-- AI 助手入口 -->
      <a href="../profile/index.html" class="ai-entry">
        <span class="icon">🤖</span>
        <div class="info">
          <div class="title">AI 助手</div>
          <div class="desc">智能记账 · 消费分析 · 问答查询</div>
        </div>
        <span class="arrow">›</span>
      </a>

      <div style="height:16px;"></div>
    </div>

    <!-- 记账输入栏 - 固定在底部导航上方 -->
    <div class="input-section">
      <div class="input-bar">
        <button class="side-btn" title="手动记账">➕</button>
        <input type="text" class="text-input" placeholder="午饭吃了碗拉面25元">
        <button class="side-btn" title="拍照识别">📷</button>
      </div>
      <div class="submit-row">
        <span class="voice-hint">
          <span class="icon">💡</span>
          <span>长按"记账"Tab语音输入</span>
        </span>
        <button class="submit-btn">记一笔</button>
      </div>
    </div>

    <!-- 语音输入浮层 -->
    <div class="voice-overlay" id="voiceOverlay">
      <span class="mic-icon">🎤</span>
      <span class="text">正在聆听...</span>
      <span class="hint">松开发送<br>左上滑取消 · 右上滑转文字</span>
    </div>

    <!-- 底部导航 -->
    <div class="bottom-nav">
      <a href="../transaction-list/index.html" class="nav-item">
        <span class="nav-icon">📋</span>
        <span>账单</span>
      </a>
      <a href="index.html" class="nav-item active" id="navRecord"
         onmousedown="startVoiceTimer()" onmouseup="handleNavRelease()" onmouseleave="cancelVoiceTimer()"
         ontouchstart="startVoiceTimer()" ontouchend="handleNavRelease()" ontouchcancel="cancelVoiceTimer()">
        <span class="nav-icon">✏️</span>
        <span>记账</span>
      </a>
      <a href="../profile/index.html" class="nav-item">
        <span class="nav-icon">👤</span>
        <span>我的</span>
      </a>
    </div>
  </div>

  <script>
    let voiceTimer = null;
    let isLongPress = false;

    function startVoiceTimer() {
      isLongPress = false;
      voiceTimer = setTimeout(() => {
        isLongPress = true;
        document.getElementById('voiceOverlay').classList.add('show');
        document.getElementById('navRecord').classList.add('voice-active');
        if (navigator.vibrate) navigator.vibrate(30);
      }, 500);
    }

    function handleNavRelease() {
      clearTimeout(voiceTimer);
      if (isLongPress) {
        document.getElementById('voiceOverlay').classList.remove('show');
        document.getElementById('navRecord').classList.remove('voice-active');
        alert('语音已发送（原型演示）');
      }
      isLongPress = false;
    }

    function cancelVoiceTimer() {
      clearTimeout(voiceTimer);
      document.getElementById('voiceOverlay').classList.remove('show');
      document.getElementById('navRecord').classList.remove('voice-active');
      isLongPress = false;
    }

    document.getElementById('navRecord').addEventListener('click', function(e) {
      if (isLongPress) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
