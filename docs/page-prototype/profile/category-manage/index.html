<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WoAccount - 分类管理</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <style>
    /* 顶部切换 */
    .type-tabs {
      display: flex;
      background: #fff;
      border-bottom: 1px solid #f0f0f0;
    }
    .type-tabs .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-size: 15px;
      font-weight: 500;
      color: #9e9e9e;
      cursor: pointer;
      border: none;
      background: transparent;
      position: relative;
      transition: color 0.2s;
    }
    .type-tabs .tab.active {
      color: #4caf50;
    }
    .type-tabs .tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 30%;
      width: 40%;
      height: 3px;
      background: #4caf50;
      border-radius: 2px;
    }

    /* 分类网格 */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px 0;
      padding: 16px 8px;
    }
    .category-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 4px;
      cursor: pointer;
      border-radius: 12px;
      transition: background 0.2s;
      position: relative;
    }
    .category-item:hover { background: #f5f5f5; }
    .category-item .icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .category-item .name {
      font-size: 11px;
      color: #212121;
      text-align: center;
      line-height: 1.2;
    }
    .category-item .sub-count {
      font-size: 9px;
      color: #bdbdbd;
    }
    /* 长按编辑角标 */
    .category-item .edit-dot {
      display: none;
      position: absolute;
      top: 6px;
      right: 10px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #f44336;
      color: #fff;
      font-size: 10px;
      line-height: 16px;
      text-align: center;
    }
    .edit-mode .category-item .edit-dot { display: block; }

    /* 添加按钮 */
    .add-category {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 4px;
      cursor: pointer;
      border-radius: 12px;
      transition: background 0.2s;
    }
    .add-category:hover { background: #f5f5f5; }
    .add-category .icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 2px dashed #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #bdbdbd;
    }
    .add-category .name {
      font-size: 11px;
      color: #bdbdbd;
    }

    /* 视图容器 */
    .view-container { display: none; }
    .view-container.active { display: block; }

    /* 提示 */
    .tip {
      padding: 12px 16px;
      font-size: 12px;
      color: #9e9e9e;
      text-align: center;
    }

    /* 编辑模式提示栏 */
    .edit-bar {
      display: none;
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 375px;
      background: #fff;
      padding: 12px 16px;
      border-top: 1px solid #f0f0f0;
      text-align: center;
      z-index: 50;
    }
    .edit-bar.show { display: block; }
    .edit-bar .done-btn {
      padding: 8px 32px;
      background: #4caf50;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="status-bar">
      <span>9:41</span>
      <span>分类管理</span>
      <span></span>
    </div>

    <div class="nav-bar">
      <a href="../index.html" class="nav-icon">←</a>
      <h1>分类管理</h1>
      <span class="nav-icon" id="editBtn" onclick="toggleEdit()">✏️</span>
    </div>

    <!-- 支出/收入切换 -->
    <div class="type-tabs">
      <button class="tab active" onclick="switchType('expense')">支出</button>
      <button class="tab" onclick="switchType('income')">收入</button>
    </div>

    <div class="content">
      <!-- ========== 支出分类 ========== -->
      <div class="view-container active" id="expenseView">
        <div class="category-grid" id="expenseGrid">
          <div class="category-item">
            <span class="edit-dot">×</span>
            <div class="icon" style="background:#fff3e0;">🍜</div>
            <span class="name">餐饮</span>
            <span class="sub-count">3个子分类</span>
          </div>
          <div class="category-item">
            <span class="edit-dot">×</span>
            <div class="icon" style="background:#e3f2fd;">🚗</div>
            <span class="name">交通</span>
            <span class="sub-count">2个子分类</span>
          </div>
          <div class="category-item">
            <span class="edit-dot">×</span>
            <div class="icon" style="background:#fce4ec;">🛒</div>
            <span class="name">购物</span>
            <span class="sub-count">2个子分类</span>
          </div>
          <div class="category-item">
            <span class="edit-dot">×</span>
            <div class="icon" style="background:#f3e5f5;">🏠</div>
            <span class="name">住房</span>
            <span class="sub-count">1个子分类</span>
          </div>
          <div class="category-item">
            <span class="edit-dot">×</span>
            <div class="icon" style="background:#e8f5e9;">🎮</div>
            <span class="name">娱乐</span>
            <span class="sub-count">2个子分类</span>
          </div>
          <div class="category-item">
            <span class="edit-dot">×</span>
            <div class="icon" style="background:#e0f7fa;">📚</div>
            <span class="name">教育</span>
            <span class="sub-count">1个子分类</span>
          </div>
          <div class="category-item">
            <span class="edit-dot">×</span>
            <div class="icon" style="background:#ffebee;">💊</div>
            <span class="name">医疗</span>
            <span class="sub-count">1个子分类</span>
          </div>
          <div class="category-item">
            <span class="edit-dot">×</span>
            <div class="icon" style="background:#fbe9e7;">👤</div>
            <span class="name">社交</span>
            <span class="sub-count">1个子分类</span>
          </div>
          <div class="category-item">
            <span class="edit-dot">×</span>
            <div class="icon" style="background:#f5f5f5;">💰</div>
            <span class="name">其他</span>
            <span class="sub-count">0个子分类</span>
          </div>
          <div class="add-category" onclick="alert('添加支出分类')">
            <div class="icon">+</div>
            <span class="name">添加</span>
          </div>
        </div>
        <div class="tip">长按分类可拖拽排序 · 点击✏️进入编辑模式</div>
      </div>

      <!-- ========== 收入分类 ========== -->
      <div class="view-container" id="incomeView">
        <div class="category-grid" id="incomeGrid">
          <div class="category-item">
            <span class="edit-dot">×</span>
            <div class="icon" style="background:#e8f5e9;">💰</div>
            <span class="name">工资</span>
            <span class="sub-count">0个子分类</span>
          </div>
          <div class="category-item">
            <span class="edit-dot">×</span>
            <div class="icon" style="background:#fff3e0;">🎁</div>
            <span class="name">奖金</span>
            <span class="sub-count">0个子分类</span>
          </div>
          <div class="category-item">
            <span class="edit-dot">×</span>
            <div class="icon" style="background:#e3f2fd;">📈</div>
            <span class="name">投资收益</span>
            <span class="sub-count">0个子分类</span>
          </div>
          <div class="category-item">
            <span class="edit-dot">×</span>
            <div class="icon" style="background:#f3e5f5;">🔄</div>
            <span class="name">退款</span>
            <span class="sub-count">0个子分类</span>
          </div>
          <div class="category-item">
            <span class="edit-dot">×</span>
            <div class="icon" style="background:#f5f5f5;">💼</div>
            <span class="name">兼职</span>
            <span class="sub-count">0个子分类</span>
          </div>
          <div class="add-category" onclick="alert('添加收入分类')">
            <div class="icon">+</div>
            <span class="name">添加</span>
          </div>
        </div>
        <div class="tip">长按分类可拖拽排序 · 点击✏️进入编辑模式</div>
      </div>
    </div>

    <!-- 编辑模式底部栏 -->
    <div class="edit-bar" id="editBar">
      <button class="done-btn" onclick="toggleEdit()">完成</button>
    </div>
  </div>

  <script>
    function switchType(type) {
      document.querySelectorAll('.type-tabs .tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
      if (type === 'expense') {
        document.querySelector('.type-tabs .tab:first-child').classList.add('active');
        document.getElementById('expenseView').classList.add('active');
      } else {
        document.querySelector('.type-tabs .tab:last-child').classList.add('active');
        document.getElementById('incomeView').classList.add('active');
      }
    }

    function toggleEdit() {
      document.querySelectorAll('.category-grid').forEach(g => g.classList.toggle('edit-mode'));
      document.getElementById('editBar').classList.toggle('show');
    }
  </script>
</body>
</html>
