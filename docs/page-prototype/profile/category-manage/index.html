<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WoAccount - 分类管理</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <style>
    .section-title {
      padding: 12px 16px 8px;
      font-size: 13px;
      color: #9e9e9e;
      font-weight: 500;
    }
    .category-list {
      background: #fff;
      margin: 0 16px 12px;
      border-radius: 12px;
      overflow: hidden;
    }
    .category-row {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #f5f5f5;
    }
    .category-row:last-child {
      border-bottom: none;
    }
    .category-row .icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-right: 12px;
    }
    .category-row .name {
      flex: 1;
      font-size: 15px;
      color: #212121;
    }
    .category-row .count {
      font-size: 13px;
      color: #9e9e9e;
      margin-right: 8px;
    }
    .category-row .actions {
      display: flex;
      gap: 8px;
    }
    .category-row .actions span {
      font-size: 16px;
      color: #bdbdbd;
      cursor: pointer;
    }
    .add-category {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 14px;
      margin: 0 16px 12px;
      background: #fff;
      border-radius: 12px;
      color: #4caf50;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .tip {
      padding: 12px 16px;
      font-size: 12px;
      color: #9e9e9e;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="status-bar">
      <span>9:41</span>
      <span>分类管理</span>
      <span></span>
    </div>

    <div class="nav-bar">
      <a href="../index.html" class="nav-icon">←</a>
      <h1>分类管理</h1>
      <span class="nav-icon">✏️</span>
    </div>

    <div class="content">
      <div class="section-title">支出分类</div>
      <div class="category-list">
        <div class="category-row">
          <div class="icon" style="background:#fff3e0;">🍜</div>
          <span class="name">餐饮</span>
          <span class="count">3个子分类</span>
          <div class="actions"><span>⋮</span></div>
        </div>
        <div class="category-row">
          <div class="icon" style="background:#e3f2fd;">🚗</div>
          <span class="name">交通</span>
          <span class="count">2个子分类</span>
          <div class="actions"><span>⋮</span></div>
        </div>
        <div class="category-row">
          <div class="icon" style="background:#fce4ec;">🛒</div>
          <span class="name">购物</span>
          <span class="count">2个子分类</span>
          <div class="actions"><span>⋮</span></div>
        </div>
        <div class="category-row">
          <div class="icon" style="background:#f3e5f5;">🏠</div>
          <span class="name">住房</span>
          <span class="count">1个子分类</span>
          <div class="actions"><span>⋮</span></div>
        </div>
        <div class="category-row">
          <div class="icon" style="background:#e8f5e9;">🎮</div>
          <span class="name">娱乐</span>
          <span class="count">2个子分类</span>
          <div class="actions"><span>⋮</span></div>
        </div>
        <div class="category-row">
          <div class="icon" style="background:#e0f7fa;">📚</div>
          <span class="name">教育</span>
          <span class="count">1个子分类</span>
          <div class="actions"><span>⋮</span></div>
        </div>
        <div class="category-row">
          <div class="icon" style="background:#ffebee;">💊</div>
          <span class="name">医疗</span>
          <span class="count">1个子分类</span>
          <div class="actions"><span>⋮</span></div>
        </div>
        <div class="category-row">
          <div class="icon" style="background:#fbe9e7;">👤</div>
          <span class="name">社交</span>
          <span class="count">1个子分类</span>
          <div class="actions"><span>⋮</span></div>
        </div>
      </div>

      <div class="section-title">收入分类</div>
      <div class="category-list">
        <div class="category-row">
          <div class="icon" style="background:#e8f5e9;">💰</div>
          <span class="name">工资</span>
          <span class="count">0个子分类</span>
          <div class="actions"><span>⋮</span></div>
        </div>
        <div class="category-row">
          <div class="icon" style="background:#e8f5e9;">🎁</div>
          <span class="name">奖金</span>
          <span class="count">0个子分类</span>
          <div class="actions"><span>⋮</span></div>
        </div>
        <div class="category-row">
          <div class="icon" style="background:#e8f5e9;">📈</div>
          <span class="name">投资收益</span>
          <span class="count">0个子分类</span>
          <div class="actions"><span>⋮</span></div>
        </div>
      </div>

      <div class="add-category">+ 添加新分类</div>
      <div class="tip">长按分类可拖拽排序</div>
    </div>
  </div>
</body>
</html>
