<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WoAccount - 预算设置</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <style>
    .budget-total {
      background: #fff;
      margin: 12px 16px;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    .budget-total .label {
      font-size: 13px;
      color: #9e9e9e;
      margin-bottom: 8px;
    }
    .budget-total .amount {
      font-size: 36px;
      font-weight: 700;
      color: #212121;
    }
    .budget-total .sub {
      font-size: 13px;
      color: #9e9e9e;
      margin-top: 8px;
    }
    .budget-progress {
      margin: 12px 16px;
      background: #fff;
      border-radius: 12px;
      padding: 16px;
    }
    .budget-progress .header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .budget-progress .header .label {
      font-size: 14px;
      color: #757575;
    }
    .budget-progress .header .value {
      font-size: 14px;
      font-weight: 600;
      color: #212121;
    }
    .budget-progress .bar {
      height: 12px;
      background: #f5f5f5;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .budget-progress .bar .fill {
      height: 100%;
      border-radius: 6px;
      background: #4caf50;
    }
    .budget-progress .bar .fill.warning {
      background: #ff9800;
    }
    .budget-progress .bar .fill.danger {
      background: #f44336;
    }
    .budget-progress .remain {
      font-size: 13px;
      color: #9e9e9e;
      text-align: right;
    }
    .category-budget {
      margin: 12px 16px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
    }
    .category-budget .header {
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 600;
      color: #212121;
      border-bottom: 1px solid #f5f5f5;
    }
    .category-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #f5f5f5;
    }
    .category-item:last-child {
      border-bottom: none;
    }
    .category-item .icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-right: 12px;
    }
    .category-item .info {
      flex: 1;
    }
    .category-item .info .name {
      font-size: 14px;
      color: #212121;
      margin-bottom: 6px;
    }
    .category-item .info .bar {
      height: 6px;
      background: #f5f5f5;
      border-radius: 3px;
      overflow: hidden;
    }
    .category-item .info .bar .fill {
      height: 100%;
      border-radius: 3px;
    }
    .category-item .budget {
      text-align: right;
      margin-left: 12px;
    }
    .category-item .budget .amount {
      font-size: 14px;
      font-weight: 600;
      color: #212121;
    }
    .category-item .budget .spent {
      font-size: 11px;
      color: #9e9e9e;
      margin-top: 2px;
    }
    .add-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 14px;
      margin: 12px 16px;
      background: #fff;
      border-radius: 12px;
      color: #4caf50;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="status-bar">
      <span>9:41</span>
      <span>预算设置</span>
      <span></span>
    </div>

    <div class="nav-bar">
      <a href="../index.html" class="nav-icon">←</a>
      <h1>预算设置</h1>
      <span class="nav-icon">💾</span>
    </div>

    <div class="content">
      <!-- 总预算 -->
      <div class="budget-total">
        <div class="label">本月总预算</div>
        <div class="amount">¥8,000</div>
        <div class="sub">已设置 5 个分类预算</div>
      </div>

      <!-- 使用进度 -->
      <div class="budget-progress">
        <div class="header">
          <span class="label">已使用</span>
          <span class="value">¥6,540 / ¥8,000</span>
        </div>
        <div class="bar">
          <div class="fill warning" style="width:82%;"></div>
        </div>
        <div class="remain">剩余 ¥1,460 (18%)</div>
      </div>

      <!-- 分类预算 -->
      <div class="category-budget">
        <div class="header">分类预算</div>

        <div class="category-item">
          <div class="icon" style="background:#fff3e0;">🍜</div>
          <div class="info">
            <div class="name">餐饮</div>
            <div class="bar"><div class="fill" style="width:78%; background:#ff9800;"></div></div>
          </div>
          <div class="budget">
            <div class="amount">¥3,000</div>
            <div class="spent">已花 ¥2,340</div>
          </div>
        </div>

        <div class="category-item">
          <div class="icon" style="background:#e3f2fd;">🚗</div>
          <div class="info">
            <div class="name">交通</div>
            <div class="bar"><div class="fill" style="width:65%; background:#2196f3;"></div></div>
          </div>
          <div class="budget">
            <div class="amount">¥2,000</div>
            <div class="spent">已花 ¥1,308</div>
          </div>
        </div>

        <div class="category-item">
          <div class="icon" style="background:#fce4ec;">🛒</div>
          <div class="info">
            <div class="name">购物</div>
            <div class="bar"><div class="fill" style="width:90%; background:#f44336;"></div></div>
          </div>
          <div class="budget">
            <div class="amount">¥1,300</div>
            <div class="spent">已花 ¥1,177</div>
          </div>
        </div>

        <div class="category-item">
          <div class="icon" style="background:#f3e5f5;">🏠</div>
          <div class="info">
            <div class="name">住房</div>
            <div class="bar"><div class="fill" style="width:49%; background:#9c27b0;"></div></div>
          </div>
          <div class="budget">
            <div class="amount">¥2,000</div>
            <div class="spent">已花 ¥981</div>
          </div>
        </div>

        <div class="category-item">
          <div class="icon" style="background:#e8f5e9;">🎮</div>
          <div class="info">
            <div class="name">娱乐</div>
            <div class="bar"><div class="fill" style="width:52%; background:#4caf50;"></div></div>
          </div>
          <div class="budget">
            <div class="amount">¥1,500</div>
            <div class="spent">已花 ¥785</div>
          </div>
        </div>
      </div>

      <div class="add-btn">+ 添加分类预算</div>
    </div>
  </div>
</body>
</html>
