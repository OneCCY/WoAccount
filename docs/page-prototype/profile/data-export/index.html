<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WoAccount - 数据导出</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <style>
    .export-card {
      background: #fff;
      margin: 12px 16px;
      border-radius: 12px;
      padding: 20px;
    }
    .export-card .title {
      font-size: 16px;
      font-weight: 600;
      color: #212121;
      margin-bottom: 16px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group .label {
      font-size: 13px;
      color: #757575;
      margin-bottom: 8px;
    }
    .date-range {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .date-input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      color: #212121;
      background: #fafafa;
    }
    .date-range .sep {
      color: #9e9e9e;
      font-size: 14px;
    }
    .format-options {
      display: flex;
      gap: 8px;
    }
    .format-option {
      flex: 1;
      padding: 12px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
    }
    .format-option.selected {
      border-color: #4caf50;
      background: #e8f5e9;
    }
    .format-option .icon {
      font-size: 24px;
      margin-bottom: 4px;
    }
    .format-option .name {
      font-size: 13px;
      color: #212121;
      font-weight: 500;
    }
    .quick-ranges {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .quick-range {
      padding: 6px 14px;
      border-radius: 16px;
      background: #f5f5f5;
      font-size: 13px;
      color: #757575;
      cursor: pointer;
    }
    .quick-range.active {
      background: #e8f5e9;
      color: #4caf50;
    }
    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #212121;
    }
    .checkbox-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #4caf50;
    }
    .export-btn {
      margin: 16px;
    }
    .history-section {
      margin: 12px 16px;
    }
    .history-section .title {
      font-size: 15px;
      font-weight: 600;
      color: #212121;
      margin-bottom: 12px;
    }
    .history-item {
      background: #fff;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .history-item .icon {
      font-size: 24px;
    }
    .history-item .info {
      flex: 1;
    }
    .history-item .info .name {
      font-size: 14px;
      color: #212121;
      font-weight: 500;
    }
    .history-item .info .meta {
      font-size: 12px;
      color: #9e9e9e;
      margin-top: 2px;
    }
    .history-item .action {
      font-size: 14px;
      color: #4caf50;
      font-weight: 500;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="status-bar">
      <span>9:41</span>
      <span>数据导出</span>
      <span></span>
    </div>

    <div class="nav-bar">
      <a href="../index.html" class="nav-icon">←</a>
      <h1>数据导出</h1>
      <span></span>
    </div>

    <div class="content">
      <div class="export-card">
        <div class="title">导出设置</div>

        <div class="form-group">
          <div class="label">时间范围</div>
          <div class="quick-ranges">
            <span class="quick-range">本月</span>
            <span class="quick-range active">近3月</span>
            <span class="quick-range">近半年</span>
            <span class="quick-range">全部</span>
          </div>
          <div class="date-range">
            <div class="date-input">2025-01-01</div>
            <span class="sep">至</span>
            <div class="date-input">2025-03-31</div>
          </div>
        </div>

        <div class="form-group">
          <div class="label">导出格式</div>
          <div class="format-options">
            <div class="format-option selected">
              <div class="icon">📊</div>
              <div class="name">Excel</div>
            </div>
            <div class="format-option">
              <div class="icon">📄</div>
              <div class="name">CSV</div>
            </div>
            <div class="format-option">
              <div class="icon">📋</div>
              <div class="name">JSON</div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <div class="label">包含字段</div>
          <div class="checkbox-group">
            <label class="checkbox-item">
              <input type="checkbox" checked> 金额
            </label>
            <label class="checkbox-item">
              <input type="checkbox" checked> 分类
            </label>
            <label class="checkbox-item">
              <input type="checkbox" checked> 日期
            </label>
            <label class="checkbox-item">
              <input type="checkbox" checked> 描述
            </label>
            <label class="checkbox-item">
              <input type="checkbox"> 账户
            </label>
            <label class="checkbox-item">
              <input type="checkbox"> 备注
            </label>
          </div>
        </div>
      </div>

      <button class="btn btn-primary btn-block export-btn">导出数据</button>

      <div class="history-section">
        <div class="title">导出历史</div>

        <div class="history-item">
          <span class="icon">📊</span>
          <div class="info">
            <div class="name">2025年1-3月账单.xlsx</div>
            <div class="meta">2025-03-31 · 156条记录 · 28KB</div>
          </div>
          <span class="action">分享</span>
        </div>

        <div class="history-item">
          <span class="icon">📊</span>
          <div class="info">
            <div class="name">2024年全年账单.xlsx</div>
            <div class="meta">2024-12-31 · 1,203条记录 · 156KB</div>
          </div>
          <span class="action">分享</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
