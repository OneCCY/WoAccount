<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WoAccount - 我的</title>
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    .user-card {
      background: #fff;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .user-card .avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #e8f5e9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .user-card .info .name {
      font-size: 18px;
      font-weight: 600;
      color: #212121;
    }
    .user-card .info .desc {
      font-size: 13px;
      color: #9e9e9e;
      margin-top: 4px;
    }

    /* 功能按钮栏 - 网格布局，每行5个 */
    .func-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px 0;
      padding: 16px 8px;
      background: #fff;
      margin-top: 1px;
    }
    .func-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }
    /* 展开区域 */
    .extra-bar {
      display: none;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px 0;
      padding: 0 8px 16px;
      background: #fff;
    }
    .extra-bar.show { display: grid; }
    .func-btn .icon-wrap {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      transition: transform 0.2s;
    }
    .func-btn:hover .icon-wrap { transform: scale(1.05); }
    .func-btn .label {
      font-size: 11px;
      color: #757575;
    }
    .icon-green { background: #e8f5e9; }
    .icon-blue { background: #e3f2fd; }
    .icon-orange { background: #fff3e0; }
    .icon-purple { background: #f3e5f5; }
    .icon-grey { background: #f5f5f5; }

    /* AI 助手入口 */
    .ai-entry {
      margin: 12px 16px;
      background: linear-gradient(135deg, #e8f5e9 0%, #f1f8e9 100%);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s;
    }
    .ai-entry:hover { transform: scale(0.98); }
    .ai-entry .icon { font-size: 32px; }
    .ai-entry .info { flex: 1; }
    .ai-entry .info .title { font-size: 16px; font-weight: 600; color: #2e7d32; }
    .ai-entry .info .desc { font-size: 12px; color: #66bb6a; margin-top: 4px; }
    .ai-entry .arrow { font-size: 20px; color: #66bb6a; }

    /* 列表菜单 */
    .menu-group {
      background: #fff;
      margin: 12px 16px;
      border-radius: 12px;
      overflow: hidden;
    }
    .menu-group .group-title {
      padding: 12px 16px 8px;
      font-size: 13px;
      color: #9e9e9e;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="status-bar">
      <span>9:41</span>
      <span>我的</span>
      <span></span>
    </div>

    <div class="content">
      <!-- 用户信息 -->
      <div class="user-card">
        <div class="avatar">👤</div>
        <div class="info">
          <div class="name">用户昵称</div>
          <div class="desc">记账达人 · 已连续记账 15 天</div>
        </div>
      </div>

      <!-- 功能按钮栏（每行最多5个） -->
      <div class="func-bar">
        <a href="#" class="func-btn" onclick="alert('密码锁设置'); return false;">
          <div class="icon-wrap icon-green">🔒</div>
          <span class="label">密码锁</span>
        </a>
        <a href="#" class="func-btn" onclick="alert('主题切换'); return false;">
          <div class="icon-wrap icon-blue">🎨</div>
          <span class="label">主题切换</span>
        </a>
        <a href="account-book/index.html" class="func-btn">
          <div class="icon-wrap icon-orange">📒</div>
          <span class="label">我的账本</span>
        </a>
        <a href="budget/index.html" class="func-btn">
          <div class="icon-wrap" style="background:#fff8e1;">💰</div>
          <span class="label">预算管理</span>
        </a>
        <a href="#" class="func-btn" id="moreBtn" onclick="toggleMore(); return false;">
          <div class="icon-wrap icon-grey">⋯</div>
          <span class="label">更多</span>
        </a>
      </div>
      <!-- 展开区域（点击更多后显示） -->
      <div class="extra-bar" id="extraBar">
        <a href="category-manage/index.html" class="func-btn">
          <div class="icon-wrap icon-purple">📂</div>
          <span class="label">分类管理</span>
        </a>
      </div>

      <!-- AI 助手入口 -->
      <a href="#" class="ai-entry" onclick="alert('AI助手对话页面（待实现）'); return false;">
        <span class="icon">🤖</span>
        <div class="info">
          <div class="title">AI 助手</div>
          <div class="desc">智能记账 · 消费分析 · 问答查询</div>
        </div>
        <span class="arrow">›</span>
      </a>

      <!-- 列表菜单 -->
      <div class="menu-group">
        <div class="group-title">数据与服务</div>
        <a href="#" class="setting-item" onclick="alert('数据备份'); return false;">
          <div class="left">
            <span class="icon">☁️</span>
            <span class="label">数据备份</span>
          </div>
          <span class="arrow">›</span>
        </a>
        <a href="bill-import/index.html" class="setting-item">
          <div class="left">
            <span class="icon">📥</span>
            <span class="label">账单导入</span>
          </div>
          <span class="arrow">›</span>
        </a>
        <a href="bill-export/index.html" class="setting-item">
          <div class="left">
            <span class="icon">📤</span>
            <span class="label">账单导出</span>
          </div>
          <span class="arrow">›</span>
        </a>
        <a href="#" class="setting-item" onclick="alert('用户反馈'); return false;">
          <div class="left">
            <span class="icon">💬</span>
            <span class="label">用户反馈</span>
          </div>
          <span class="arrow">›</span>
        </a>
        <a href="#" class="setting-item" onclick="alert('账本回收站'); return false;">
          <div class="left">
            <span class="icon">🗑️</span>
            <span class="label">账本回收站</span>
          </div>
          <span class="arrow">›</span>
        </a>
      </div>

      <div class="menu-group">
        <a href="settings/index.html" class="setting-item">
          <div class="left">
            <span class="icon">⚙️</span>
            <span class="label">设置</span>
          </div>
          <span class="arrow">›</span>
        </a>
      </div>

      <div style="height:20px;"></div>
    </div>

    <!-- 底部导航 -->
    <div class="bottom-nav">
      <a href="../transaction-list/index.html" class="nav-item">
        <span class="nav-icon">📋</span>
        <span>账单</span>
      </a>
      <a href="../home/index.html" class="nav-item">
        <span class="nav-icon">✏️</span>
        <span>记账</span>
      </a>
      <a href="index.html" class="nav-item active">
        <span class="nav-icon">👤</span>
        <span>我的</span>
      </a>
    </div>
  </div>
  <script>
    function toggleMore() {
      document.getElementById('extraBar').classList.toggle('show');
    }
  </script>
</body>
</html>
