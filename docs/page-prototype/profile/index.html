<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WoAccount - 我的</title>
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    .user-card {
      background: #fff;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .user-card .avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #e8f5e9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .user-card .info .name {
      font-size: 18px;
      font-weight: 600;
      color: #212121;
    }
    .user-card .info .level {
      font-size: 13px;
      color: #9e9e9e;
      margin-top: 4px;
    }
    .stats-section {
      margin: 12px 16px;
    }
    .stats-section .section-title {
      font-size: 15px;
      font-weight: 600;
      color: #212121;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stats-summary {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }
    .stats-card {
      flex: 1;
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
    }
    .stats-card .label {
      font-size: 12px;
      color: #9e9e9e;
      margin-bottom: 6px;
    }
    .stats-card .value {
      font-size: 18px;
      font-weight: 700;
      color: #212121;
    }
    .stats-card .value.expense { color: #f44336; }
    .stats-card .value.income { color: #4caf50; }
    .chart-card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .chart-card .chart-title {
      font-size: 14px;
      font-weight: 600;
      color: #212121;
      margin-bottom: 12px;
    }
    .pie-chart {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: conic-gradient(
        #ff9800 0% 35%,
        #2196f3 35% 55%,
        #e91e63 55% 73%,
        #9c27b0 73% 88%,
        #4caf50 88% 100%
      );
      margin: 0 auto 16px;
      position: relative;
    }
    .pie-chart::after {
      content: '';
      position: absolute;
      top: 30%;
      left: 30%;
      width: 40%;
      height: 40%;
      background: #fff;
      border-radius: 50%;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: #757575;
    }
    .legend-item .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .ranking-list {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
    }
    .ranking-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .ranking-item:last-child {
      margin-bottom: 0;
    }
    .ranking-item .rank {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: #757575;
    }
    .ranking-item .rank.top {
      background: #fff3e0;
      color: #ff9800;
    }
    .ranking-item .name {
      width: 50px;
      font-size: 13px;
      color: #212121;
    }
    .ranking-item .bar-wrap {
      flex: 1;
      height: 20px;
      background: #f5f5f5;
      border-radius: 4px;
      overflow: hidden;
    }
    .ranking-item .bar-wrap .bar {
      height: 100%;
      border-radius: 4px;
    }
    .ranking-item .amount {
      font-size: 13px;
      font-weight: 600;
      color: #212121;
      width: 60px;
      text-align: right;
    }
    .view-detail-btn {
      display: block;
      text-align: center;
      padding: 10px;
      margin-top: 8px;
      color: #4caf50;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .ai-entry {
      margin: 12px 16px;
      background: linear-gradient(135deg, #e8f5e9 0%, #f1f8e9 100%);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s;
    }
    .ai-entry:hover {
      transform: scale(0.98);
    }
    .ai-entry .icon {
      font-size: 32px;
    }
    .ai-entry .info {
      flex: 1;
    }
    .ai-entry .info .title {
      font-size: 16px;
      font-weight: 600;
      color: #2e7d32;
    }
    .ai-entry .info .desc {
      font-size: 12px;
      color: #66bb6a;
      margin-top: 4px;
    }
    .ai-entry .arrow {
      font-size: 20px;
      color: #66bb6a;
    }
    .settings-group {
      background: #fff;
      margin: 12px 16px;
      border-radius: 12px;
      overflow: hidden;
    }
    .settings-group .group-title {
      padding: 12px 16px 8px;
      font-size: 13px;
      color: #9e9e9e;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="status-bar">
      <span>9:41</span>
      <span>我的</span>
      <span></span>
    </div>

    <div class="content">
      <!-- 用户信息 -->
      <div class="user-card">
        <div class="avatar">👤</div>
        <div class="info">
          <div class="name">用户昵称</div>
          <div class="level">消费等级 Lv.5</div>
        </div>
      </div>

      <!-- 统计概览 -->
      <div class="stats-section">
        <div class="section-title">📊 本月统计</div>

        <div class="stats-summary">
          <div class="stats-card">
            <div class="label">总支出</div>
            <div class="value expense">¥6,540</div>
          </div>
          <div class="stats-card">
            <div class="label">总收入</div>
            <div class="value income">¥12,000</div>
          </div>
          <div class="stats-card">
            <div class="label">结余</div>
            <div class="value">¥5,460</div>
          </div>
        </div>

        <!-- 饼图 -->
        <div class="chart-card">
          <div class="chart-title">🥧 消费分类占比</div>
          <div class="pie-chart"></div>
          <div class="legend">
            <span class="legend-item"><span class="dot" style="background:#ff9800;"></span>餐饮 35%</span>
            <span class="legend-item"><span class="dot" style="background:#2196f3;"></span>交通 20%</span>
            <span class="legend-item"><span class="dot" style="background:#e91e63;"></span>购物 18%</span>
            <span class="legend-item"><span class="dot" style="background:#9c27b0;"></span>住房 15%</span>
            <span class="legend-item"><span class="dot" style="background:#4caf50;"></span>娱乐 12%</span>
          </div>
        </div>

        <!-- 分类排行 -->
        <div class="ranking-list">
          <div class="chart-title">🏆 分类排行</div>

          <div class="ranking-item">
            <span class="rank top">1</span>
            <span class="name">餐饮</span>
            <div class="bar-wrap"><div class="bar" style="width:100%; background:#ff9800;"></div></div>
            <span class="amount">¥2,340</span>
          </div>

          <div class="ranking-item">
            <span class="rank top">2</span>
            <span class="name">交通</span>
            <div class="bar-wrap"><div class="bar" style="width:56%; background:#2196f3;"></div></div>
            <span class="amount">¥1,308</span>
          </div>

          <div class="ranking-item">
            <span class="rank top">3</span>
            <span class="name">购物</span>
            <div class="bar-wrap"><div class="bar" style="width:50%; background:#e91e63;"></div></div>
            <span class="amount">¥1,177</span>
          </div>

          <div class="ranking-item">
            <span class="rank">4</span>
            <span class="name">住房</span>
            <div class="bar-wrap"><div class="bar" style="width:42%; background:#9c27b0;"></div></div>
            <span class="amount">¥981</span>
          </div>

          <div class="ranking-item">
            <span class="rank">5</span>
            <span class="name">娱乐</span>
            <div class="bar-wrap"><div class="bar" style="width:34%; background:#4caf50;"></div></div>
            <span class="amount">¥785</span>
          </div>
        </div>

        <div class="view-detail-btn">查看详细统计 →</div>
      </div>

      <!-- AI 助手入口 -->
      <a href="#" class="ai-entry" onclick="alert('AI助手对话页面（待实现）'); return false;">
        <span class="icon">🤖</span>
        <div class="info">
          <div class="title">AI 助手</div>
          <div class="desc">智能记账 · 消费分析 · 问答查询</div>
        </div>
        <span class="arrow">›</span>
      </a>

      <!-- 设置入口 -->
      <div class="settings-group">
        <div class="group-title">设置与管理</div>
        <a href="budget-setting/index.html" class="setting-item">
          <div class="left">
            <span class="icon">💰</span>
            <span class="label">预算设置</span>
          </div>
          <span class="arrow">›</span>
        </a>
        <a href="category-manage/index.html" class="setting-item">
          <div class="left">
            <span class="icon">📂</span>
            <span class="label">分类管理</span>
          </div>
          <span class="arrow">›</span>
        </a>
        <a href="data-export/index.html" class="setting-item">
          <div class="left">
            <span class="icon">📤</span>
            <span class="label">数据导出</span>
          </div>
          <span class="arrow">›</span>
        </a>
        <a href="settings/index.html" class="setting-item">
          <div class="left">
            <span class="icon">⚙️</span>
            <span class="label">系统设置</span>
          </div>
          <span class="arrow">›</span>
        </a>
      </div>

      <div style="height:20px;"></div>
    </div>

    <!-- 底部导航 -->
    <div class="bottom-nav">
      <a href="../transaction-list/index.html" class="nav-item">
        <span class="nav-icon">📋</span>
        <span>账单</span>
      </a>
      <a href="../home/index.html" class="nav-item">
        <span class="nav-icon">✏️</span>
        <span>记账</span>
      </a>
      <a href="index.html" class="nav-item active">
        <span class="nav-icon">👤</span>
        <span>我的</span>
      </a>
    </div>
  </div>
</body>
</html>
