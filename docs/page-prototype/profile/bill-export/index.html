<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WoAccount - 账单导出</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <style>
    /* 时间范围 */
    .range-section {
      margin: 12px 16px;
      background: #fff;
      border-radius: 12px;
      padding: 16px;
    }
    .range-section .title {
      font-size: 14px;
      font-weight: 600;
      color: #212121;
      margin-bottom: 12px;
    }
    .range-presets {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .preset-btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid #e0e0e0;
      background: #fff;
      font-size: 13px;
      color: #757575;
      cursor: pointer;
      transition: all 0.2s;
    }
    .preset-btn.active {
      background: #e8f5e9;
      border-color: #4caf50;
      color: #4caf50;
    }
    .date-range {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .date-input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      color: #212121;
      text-align: center;
      cursor: pointer;
    }
    .date-input:focus { border-color: #4caf50; outline: none; }
    .date-sep { color: #9e9e9e; font-size: 14px; }

    /* 筛选条件 */
    .filter-section {
      margin: 0 16px 12px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
    }
    .filter-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid #f5f5f5;
      cursor: pointer;
    }
    .filter-item:last-child { border-bottom: none; }
    .filter-item .label { font-size: 15px; color: #212121; }
    .filter-item .value {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: #9e9e9e;
    }
    .filter-item .arrow { color: #bdbdbd; font-size: 16px; }

    /* 导出格式 */
    .format-section {
      margin: 0 16px 12px;
      background: #fff;
      border-radius: 12px;
      padding: 16px;
    }
    .format-section .title {
      font-size: 14px;
      font-weight: 600;
      color: #212121;
      margin-bottom: 12px;
    }
    .format-options {
      display: flex;
      gap: 12px;
    }
    .format-option {
      flex: 1;
      padding: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .format-option.selected {
      border-color: #4caf50;
      background: #e8f5e9;
    }
    .format-option .icon { font-size: 28px; margin-bottom: 6px; }
    .format-option .name { font-size: 13px; font-weight: 600; color: #212121; }
    .format-option .desc { font-size: 11px; color: #9e9e9e; margin-top: 2px; }

    /* 导出字段 */
    .fields-section {
      margin: 0 16px 12px;
      background: #fff;
      border-radius: 12px;
      padding: 16px;
    }
    .fields-section .title {
      font-size: 14px;
      font-weight: 600;
      color: #212121;
      margin-bottom: 12px;
    }
    .field-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .field-tag {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid #e0e0e0;
      background: #fff;
      color: #757575;
    }
    .field-tag.selected {
      background: #e8f5e9;
      border-color: #4caf50;
      color: #4caf50;
    }

    /* 预览 */
    .preview-section {
      margin: 0 16px 12px;
      background: #fff;
      border-radius: 12px;
      padding: 16px;
    }
    .preview-section .title {
      font-size: 14px;
      font-weight: 600;
      color: #212121;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .preview-section .count {
      font-size: 13px;
      color: #9e9e9e;
      font-weight: 400;
    }
    .preview-table {
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #f0f0f0;
      border-radius: 8px;
    }
    .preview-table table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .preview-table th {
      background: #fafafa;
      padding: 8px;
      text-align: left;
      font-weight: 600;
      color: #757575;
      border-bottom: 1px solid #f0f0f0;
      position: sticky;
      top: 0;
    }
    .preview-table td {
      padding: 8px;
      border-bottom: 1px solid #f5f5f5;
      color: #212121;
    }

    /* 导出按钮 */
    .export-btn {
      display: block;
      margin: 16px;
      padding: 14px;
      background: #4caf50;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      width: calc(100% - 32px);
    }
    .export-btn:hover { background: #43a047; }

    .tip {
      padding: 12px 16px;
      font-size: 12px;
      color: #bdbdbd;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="status-bar">
      <span>9:41</span>
      <span>账单导出</span>
      <span></span>
    </div>

    <div class="nav-bar">
      <a href="../index.html" class="nav-icon">←</a>
      <h1>账单导出</h1>
      <span></span>
    </div>

    <div class="content">
      <!-- 时间范围 -->
      <div class="range-section">
        <div class="title">📅 时间范围</div>
        <div class="range-presets">
          <span class="preset-btn" onclick="selectPreset(this)">最近7天</span>
          <span class="preset-btn active" onclick="selectPreset(this)">最近30天</span>
          <span class="preset-btn" onclick="selectPreset(this)">本月</span>
          <span class="preset-btn" onclick="selectPreset(this)">上月</span>
          <span class="preset-btn" onclick="selectPreset(this)">本年</span>
          <span class="preset-btn" onclick="selectPreset(this)">全部</span>
        </div>
        <div class="date-range">
          <input type="text" class="date-input" value="2026-05-05" readonly>
          <span class="date-sep">至</span>
          <input type="text" class="date-input" value="2026-06-04" readonly>
        </div>
      </div>

      <!-- 筛选条件 -->
      <div class="filter-section">
        <div class="filter-item" onclick="alert('选择交易类型')">
          <span class="label">交易类型</span>
          <div class="value">全部 <span class="arrow">›</span></div>
        </div>
        <div class="filter-item" onclick="alert('选择分类')">
          <span class="label">分类</span>
          <div class="value">全部分类 <span class="arrow">›</span></div>
        </div>
        <div class="filter-item" onclick="alert('选择账本')">
          <span class="label">账本</span>
          <div class="value">日常记账 <span class="arrow">›</span></div>
        </div>
      </div>

      <!-- 导出格式 -->
      <div class="format-section">
        <div class="title">📄 导出格式</div>
        <div class="format-options">
          <div class="format-option selected" onclick="selectFormat(this)">
            <div class="icon">📄</div>
            <div class="name">CSV</div>
            <div class="desc">通用格式</div>
          </div>
          <div class="format-option" onclick="selectFormat(this)">
            <div class="icon">📊</div>
            <div class="name">Excel</div>
            <div class="desc">.xlsx 格式</div>
          </div>
          <div class="format-option" onclick="selectFormat(this)">
            <div class="icon">📋</div>
            <div class="name">JSON</div>
            <div class="desc">开发者友好</div>
          </div>
        </div>
      </div>

      <!-- 导出字段 -->
      <div class="fields-section">
        <div class="title">📝 导出字段</div>
        <div class="field-grid">
          <span class="field-tag selected">日期</span>
          <span class="field-tag selected">金额</span>
          <span class="field-tag selected">收/支</span>
          <span class="field-tag selected">分类</span>
          <span class="field-tag selected">描述</span>
          <span class="field-tag" onclick="this.classList.toggle('selected')">备注</span>
          <span class="field-tag" onclick="this.classList.toggle('selected')">账本</span>
          <span class="field-tag" onclick="this.classList.toggle('selected')">创建时间</span>
        </div>
      </div>

      <button class="export-btn" onclick="alert('导出成功，已生成文件')">导出 128 条记录</button>

      <div class="tip">
        导出文件将通过系统分享面板发送<br>
        可保存到本地或发送到其他应用
      </div>
    </div>
  </div>

  <script>
    function selectPreset(el) {
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }
    function selectFormat(el) {
      document.querySelectorAll('.format-option').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
    }
  </script>
</body>
</html>
