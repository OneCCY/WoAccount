<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WoAccount - 账单详情</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <style>
    .detail-header {
      text-align: center;
      padding: 24px 16px;
      background: #fff;
    }
    .detail-header .icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #fff3e0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 12px;
    }
    .detail-header .category {
      font-size: 14px;
      color: #9e9e9e;
      margin-bottom: 4px;
    }
    .detail-header .amount {
      font-size: 32px;
      font-weight: 700;
      color: #f44336;
    }
    .detail-header .amount.income {
      color: #4caf50;
    }
    .info-list {
      background: #fff;
      margin: 12px 16px;
      border-radius: 12px;
      overflow: hidden;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #f5f5f5;
    }
    .info-row:last-child {
      border-bottom: none;
    }
    .info-row .label {
      font-size: 14px;
      color: #9e9e9e;
    }
    .info-row .value {
      font-size: 14px;
      color: #212121;
      font-weight: 500;
    }
    .action-btns {
      display: flex;
      gap: 12px;
      padding: 16px;
    }
    .action-btns .btn {
      flex: 1;
    }
    .delete-btn {
      text-align: center;
      padding: 12px;
      color: #f44336;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="status-bar">
      <span>9:41</span>
      <span>账单详情</span>
      <span></span>
    </div>

    <div class="nav-bar">
      <a href="../index.html" class="nav-icon">←</a>
      <h1>账单详情</h1>
      <span class="nav-icon">✏️</span>
    </div>

    <div class="content">
      <div class="detail-header">
        <div class="icon">🍜</div>
        <div class="category">餐饮 > 午餐</div>
        <div class="amount">-¥25.00</div>
      </div>

      <div class="info-list">
        <div class="info-row">
          <span class="label">描述</span>
          <span class="value">午饭拉面</span>
        </div>
        <div class="info-row">
          <span class="label">日期</span>
          <span class="value">2025-01-15 12:30</span>
        </div>
        <div class="info-row">
          <span class="label">分类</span>
          <span class="value">餐饮 > 午餐</span>
        </div>
        <div class="info-row">
          <span class="label">账户</span>
          <span class="value">微信支付</span>
        </div>
        <div class="info-row">
          <span class="label">备注</span>
          <span class="value" style="color:#bdbdbd;">无</span>
        </div>
        <div class="info-row">
          <span class="label">创建时间</span>
          <span class="value">2025-01-15 12:31</span>
        </div>
      </div>

      <div class="action-btns">
        <button class="btn btn-outline">编辑</button>
        <button class="btn btn-primary">复制</button>
      </div>

      <div class="delete-btn">删除此账单</div>
    </div>
  </div>
</body>
</html>
